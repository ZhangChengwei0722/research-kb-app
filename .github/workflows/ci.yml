name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify validation risk
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      level: ${{ steps.risk.outputs.level }}
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Classify changed paths
        id: risk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $level = "L3"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "level=$level" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          if ("${{ github.event_name }}" -eq "pull_request") {
            $changes = @(git diff --name-status --find-renames "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          }
          elseif ("${{ github.event_name }}" -eq "push") {
            $before = "${{ github.event.before }}"
            if ($before -match '^0+$') {
              "level=$level" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }
            else {
              $changes = @(git diff --name-status --find-renames $before "${{ github.sha }}")
            }
          }
          else {
            $changes = @()
          }

          if ($LASTEXITCODE -ne 0 -or $changes.Count -eq 0) {
            "level=$level" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $assessmentText = ($changes -join "`n") | python tools/ci_risk_classifier.py --json
          if ($LASTEXITCODE -eq 0) {
            try {
              $assessment = $assessmentText | ConvertFrom-Json
              if ($assessment.level -in @("L0", "L1", "L2", "L3")) {
                $level = $assessment.level
              }
            }
            catch {
              $level = "L3"
            }
          }
          "level=$level" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  policy:
    name: Public source policy
    needs: classify
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install policy test dependencies
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.3
      - name: Run source-only policy tests
        run: >-
          python -m pytest --noconftest -q
          tests/python/test_ci_risk_classifier.py
          tests/python/test_workflow_policy.py
          tests/python/test_package_policy.py
          tests/python/test_public_fixture_contract.py
          tests/python/test_release_artifact_policy.py
          tests/python/test_sanitized_source_policy.py

  frontend:
    name: Frontend
    needs:
      - classify
      - policy
    if: ${{ needs.classify.outputs.level == 'L2' || needs.classify.outputs.level == 'L3' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependency lock
        run: npm audit --audit-level=high
      - name: Run frontend tests
        run: npm test
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Upload frontend closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-release
          path: web/release
          if-no-files-found: error

  python:
    name: Python ${{ matrix.python-version }}
    needs:
      - classify
      - policy
    if: ${{ needs.classify.outputs.level != 'L0' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare frontend closure placeholder for editable install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path web/release | Out-Null
          if (-not (Test-Path -LiteralPath web/release/index.html)) {
            "<!doctype html><title>CI frontend placeholder</title>" |
              Set-Content -Path web/release/index.html -Encoding utf8 -NoNewline
          }
          "frontend closure is replaced by the Frontend artifact before packaging" |
            Set-Content -Path web/release/CI-PLACEHOLDER.txt -Encoding utf8 -NoNewline
      - name: Install locked Python dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Install App without dependency re-resolution
        run: python -m pip install --editable . --no-deps
      - name: Install pinned test runner dependencies
        run: python -m pip install pytest==9.1.1 httpx==0.28.1
      - name: Run Python tests
        run: python -m pytest -q

  package:
    name: Package after frontend closure
    needs:
      - classify
      - policy
      - frontend
      - python
    if: >-
      ${{ always() && needs.classify.outputs.level == 'L3' &&
      needs.policy.result == 'success' && needs.frontend.result == 'success' &&
      needs.python.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download frontend closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-release
          path: web/release
      - name: Remove Python-job frontend placeholder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Path web/release/CI-PLACEHOLDER.txt -ErrorAction SilentlyContinue
      - name: Build Python distributions
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --sdist --outdir dist
      - name: Validate Python distributions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          python scripts/verify_release_artifacts.py --dist-dir dist --expected-version $version
      - name: Upload CI package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-package
          path: dist
          if-no-files-found: error
