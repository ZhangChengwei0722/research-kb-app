name: Release Candidate Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Release candidate frontend
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependency lock
        run: npm audit --audit-level=high
      - name: Run frontend tests
        run: npm test
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Upload release candidate frontend closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-frontend
          path: web/release
          if-no-files-found: error

  python:
    name: Release candidate Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked Python dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Prepare frontend closure placeholder for editable install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path web/release | Out-Null
          if (-not (Test-Path -LiteralPath web/release/index.html)) {
            "<!doctype html><title>release candidate frontend placeholder</title>" |
              Set-Content -Path web/release/index.html -Encoding utf8 -NoNewline
          }
      - name: Install App without dependency re-resolution
        run: python -m pip install --editable . --no-deps
      - name: Install pinned test runner dependencies
        run: python -m pip install pytest==9.1.1 httpx==0.28.1
      - name: Run Python tests
        run: python -m pytest -q

  package:
    name: Build release candidate packages
    needs:
      - frontend
      - python
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit locked Python dependencies with pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --no-deps --disable-pip --progress-spinner off -r requirements.lock
      - name: Download release candidate frontend closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-frontend
          path: web/release
      - name: Build release candidate packages
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --sdist --outdir dist
      - name: Validate release candidate packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          python scripts/verify_release_artifacts.py --dist-dir dist --expected-version $version
      - name: Upload release candidate CI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-package
          path: dist
          if-no-files-found: error
