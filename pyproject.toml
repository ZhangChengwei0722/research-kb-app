[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "research-kb-app"
version = "0.1.1b2"
description = "Secure localhost product layer for Research KB Core"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
keywords = ["research", "knowledge-base", "local-first", "localhost", "pdf", "scientific-workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "attrs==26.1.0",
  "cffi==2.1.1",
  "charset-normalizer==3.5.0",
  "cryptography==50.0.0",
  "fastapi==0.140.13",
  "filelock==3.32.3",
  "jsonschema==4.26.0",
  "jsonschema-specifications==2025.9.1",
  "packaging==26.3",
  "pdfminer.six==20260107",
  "pdfplumber==0.11.10",
  "pillow==12.3.0",
  "pycparser==3.0",
  "pypdfium2==5.13.0",
  "python-multipart==0.0.32",
  "pyyaml==6.0.3",
  "referencing==0.37.0",
  "research-kb-core[pdf]==0.1.1",
  "rpds-py==2026.6.3",
  "typing-extensions==4.16.0",
  "uvicorn==0.52.3",
]

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[project.scripts]
research-kb-app = "research_kb_app.entrypoint:main"

[tool.hatch.build]
exclude = [
  ".git",
  ".git/**",
  ".pytest_cache/**",
  ".venv/**",
  "core-compatibility.new.json",
  "docs/**",
  "node_modules/**",
  ".playwright-cli",
  ".playwright-cli/**",
  "playwright-report/**",
  "test-results/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_kb_app"]

[tool.hatch.build.targets.wheel.force-include]
"core-compatibility.json" = "research_kb_app/core-compatibility.json"
"web/release" = "research_kb_app/web_dist"

[tool.hatch.build.targets.sdist.force-include]
"docs/architecture.md" = "docs/architecture.md"
"docs/assets/headed-bootstrap-b2.png" = "docs/assets/headed-bootstrap-b2.png"
"docs/assets/headed-setup-b2.png" = "docs/assets/headed-setup-b2.png"
"docs/assets/headed-trusted-parse-b2.png" = "docs/assets/headed-trusted-parse-b2.png"
"docs/configuration.md" = "docs/configuration.md"
"docs/installation.md" = "docs/installation.md"
"docs/known-limitations-and-privacy.md" = "docs/known-limitations-and-privacy.md"
"docs/r1-operator-guide.md" = "docs/r1-operator-guide.md"
"docs/support-matrix.md" = "docs/support-matrix.md"
"docs/workflow.md" = "docs/workflow.md"
"web/release" = "web/release"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/python"]
